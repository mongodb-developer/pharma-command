name: pharma-stockout-tool
entrypoint: stockout_agent.main:app
framework: langgraph
language: python
features:
  memory: false
sandboxes:
  agent:
    secrets: []
    tools: []
    network:
      egress_mode: deny_all
  tool:
    secrets:
      - OPENAI_API_KEY
    tools:
      - check_stockout_risk
      - invoke_llm
    network:
      egress_mode: allow_list
      egress:
        - fqdn: api.openai.com
          ports: [443]
