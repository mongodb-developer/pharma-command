[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pharma-stockout-custom-tool"
version = "0.1.0"
description = "One custom Atlas Agent Engine tool, explained through pharmacy stockout risk"
requires-python = ">=3.11"
dependencies = [
  "agent-engine-sdk-langgraph==0.11.11",
  "agent-engine-runner-shared==0.11.11",
  "langgraph",
  "langchain-openai",
  "pymongo>=4.8,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["stockout_agent"]
